[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eventflow"
version = "0.1.0"
description = "Hybrid discrete-continuous generative models for financial market-event sequences."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joshua Wu", email = "joshwu10806@gmail.com" }]
readme = "README.rst"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
# Parquet ingestion only; CSV and LOBSTER adapters need nothing beyond numpy.
parquet = ["pyarrow>=14"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyarrow>=14",
]

[project.scripts]
eventflow = "eventflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eventflow"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "." keeps the repository tools importable; "src" lets tests run without an install.
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: small optimisation checks (seconds on CPU); excluded with -m 'not slow'",
]

[tool.coverage.run]
source = ["src/eventflow"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Torch modules conventionally use single-letter tensor names (B, T, D).
"src/eventflow/**/*.py" = ["E741"]
